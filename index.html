
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Calculadora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #101827;
            font-family: Arial, sans-serif;
        }

        .calculadora {
            width: 320px;
            padding: 20px;
            background: #1e293b;
            border-radius: 18px;
        }

        h2 {
            color: white;
            text-align: center;
        }

        #visor {
            width: 100%;
            height: 65px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 28px;
            text-align: right;
            border: none;
            border-radius: 8px;
            background: #e2e8f0;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 9px;
        }

        button {
            height: 58px;
            border: none;
            border-radius: 9px;
            font-size: 21px;
            cursor: pointer;
            background: #334155;
            color: white;
        }

        button:active {
            opacity: 0.7;
        }

        .operador {
            background: #2563eb;
        }

        .limpar {
            background: #dc2626;
        }

        .igual {
            background: #16a34a;
        }
    </style>
</head>

<body>

    <div class="calculadora">

        <h2>Minha Calculadora</h2>

        <input
            type="text"
            id="visor"
            value="0"
            readonly
        >

        <div class="botoes">

            <button class="limpar" onclick="limpar()">C</button>
            <button onclick="apagar()">⌫</button>
            <button class="operador" onclick="operacao('/')">÷</button>
            <button class="operador" onclick="operacao('*')">×</button>

            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button class="operador" onclick="operacao('-')">−</button>

            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button class="operador" onclick="operacao('+')">+</button>

            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button class="igual" onclick="calcular()">=</button>

            <button onclick="adicionar('0')">0</button>
            <button onclick="adicionar('.')">.</button>

        </div>
    </div>

    <script>
        const visor = document.getElementById("visor");

        let primeiroNumero = null;
        let operador = null;
        let iniciarNovoNumero = false;

        function adicionar(valor) {

            if (iniciarNovoNumero || visor.value === "0") {
                visor.value = valor;
                iniciarNovoNumero = false;
            } else {
                visor.value += valor;
            }

        }

        function limpar() {

            visor.value = "0";
            primeiroNumero = null;
            operador = null;
            iniciarNovoNumero = false;

        }

        function apagar() {

            if (iniciarNovoNumero) return;

            visor.value = visor.value.slice(0, -1) || "0";

        }

        function operacao(sinal) {

            primeiroNumero = Number(visor.value);
            operador = sinal;
            iniciarNovoNumero = true;

        }

        function calcular() {

            if (primeiroNumero === null || operador === null) {
                return;
            }

            const segundoNumero = Number(visor.value);
            let resultado;

            switch (operador) {

                case "+":
                    resultado = primeiroNumero + segundoNumero;
                    break;

                case "-":
                    resultado = primeiroNumero - segundoNumero;
                    break;

                case "*":
                    resultado = primeiroNumero * segundoNumero;
                    break;

                case "/":
                    if (segundoNumero === 0) {
                        visor.value = "Erro";
                        primeiroNumero = null;
                        operador = null;
                        iniciarNovoNumero = true;
                        return;
                    }

                    resultado = primeiroNumero / segundoNumero;
                    break;

            }

            visor.value = String(resultado);

            primeiroNumero = null;
            operador = null;
            iniciarNovoNumero = true;

        }
    </script>

</body>
</html>
